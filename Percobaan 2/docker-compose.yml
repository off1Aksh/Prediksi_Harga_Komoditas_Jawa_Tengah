services:
  backend:
    build: ./backend
    container_name: skripsi-backend
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - skripsi-net

  nginx:
    image: nginx:alpine
    container_name: skripsi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - skripsi-net

networks:
  skripsi-net:
    driver: bridge
